Wracks = Истязатели
Wraithblades = Призрачные клинки
Wraithbone Singing = Пение призрачной кости
Wraithbone Spire = Шпиль призрачной кости
Wraithguard = Призрачная стража
Wraithknight = Призрачный рыцарь
Wraithlord = Призрачный лорд
Wych = Ведьма
Wych Arena = Арена ведьм
Wych Cult Arenas = Арены культов ведьм
Ya gimme dis, I give ya dat. Fair, innit? = Ты мне эт, я те то. Честно же?
Ya lookin' fer a krumpin'? = Кромсалова ищешь?
Ya wanna fight? Good! Dat's da best part! = Хошь драться? Харашо! Эт самое лучшее!
You are a speck of dust. = Вы лишь пылинка.
You are young. Listen, and learn. = Вы молоды. Слушайте и учитесь.
You bore me. That is dangerous. = Вы мне наскучили. Это опасно.
You dare strike at the Imperium? Then you will be erased. = Вы посмели ударить Империум? Тогда вас сотрут.
You disturb the sleep of kings. = Вы тревожите сон королей.
You have been crushed. = Вы сокрушены.
You have chosen your own damnation. = Вы сами избрали своё проклятие.
You have damaged sacred machinery. Prepare for retribution. = Вы повредили священные механизмы. Готовьтесь к возмездию.
You have refused the Greater Good. We must act. = Вы отвергли Высшее Благо. Мы должны действовать.
You leave us no choice. War it must be. = Вы не оставили нам выбора. Быть войне.
You stand before the Despoiler. Kneel or die. = Вы стоите перед Осквернителем. Преклонитесь или умрите.
You strike at the faithful? The faithful strike back. = Вы бьёте по верным? Верные ответят.
You test our patience. = Вы испытываете наше терпение.
Your doctrine rules the stars. You have won a Cultural Victory! = Ваша доктрина правит звёздами. Вы одержали Культурную победу!
Your heresy against the Machine God will be corrected. = Ваша ересь против Бога-Машины будет исправлена.
Your heresy ends here. Purge them all! = Ваша ересь закончится здесь. Очистить всё!
Your heresy will be purged in holy flame! = Ваша ересь будет очищена святым пламенем!
Your hostility serves no one. = Ваша враждебность никому не служит.
Your presence is noted... and logged. = Ваше присутствие отмечено... и записано.
Your screams will feed us for centuries. = Ваши крики будут питать нас веками.
Your skulls will make fine trophies. = Ваши черепа станут отличными трофеями.
Your worlds will burn in the name of the gods! = Ваши миры сгорят во имя богов!
Zealots who discharge the Motive Force in battle. = Фанатики, разряжающие Движущую Силу в бою.
Zealous Missions = Ревностные миссии
Zealous Preachers = Ревностные проповедники
Zephyrim = Зефирим
Zoanthrope = Зоантроп
Zogwort = Зогворт

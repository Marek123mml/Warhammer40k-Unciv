# Warhammer 40k ruleset — Russian translation

'A billion souls, stacked to the sky.' = «Миллиард душ, сложенных до самого неба.»
'A light in the storm, a beacon across the galaxy.' = «Свет в буре, маяк через всю галактику.»
'Every byte is sacred. Every byte is stored.' = «Каждый байт свят. Каждый байт сохранён.»
'Every road in the galaxy now begins here.' = «Отныне каждая дорога галактики начинается здесь.»
'Every world gives. The Treasury remembers.' = «Каждый мир платит. Казна помнит.»
'From here, the fleets of a hundred worlds were born.' = «Отсюда вышли флоты сотни миров.»
'Glory is earned in blood and sand.' = «Слава добывается кровью и песком.»
'Here the god-machines rest between wars.' = «Здесь боги-машины отдыхают между войнами.»
'Its bells are heard on three continents.' = «Её колокола слышны на трёх континентах.»
'Kneel where the demigod once stood.' = «Преклони колени там, где стоял полубог.»
'Some books read you back.' = «Некоторые книги читают тебя в ответ.»
'Ten thousand voices, one prayer, one light.' = «Десять тысяч голосов, одна молитва, один свет.»
'Ten thousand years, and the walls have never fallen.' = «Десять тысяч лет — и стены ни разу не пали.»
'The forge never sleeps.' = «Кузня никогда не спит.»
'The old machines still remember how to make miracles.' = «Старые машины всё ещё помнят, как творить чудеса.»
'The throne endures, and the realm endures with it.' = «Он восседает на троне, и трон поддерживает его жизнь.»
'Their names are carved in adamantium.' = «Их имена высечены в адамантии.»
